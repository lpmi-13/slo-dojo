global:
    scrape_interval: 5s
    evaluation_interval: 5s

rule_files:
    - /etc/prometheus/rules.yml

alerting:
    alertmanagers:
        - static_configs:
              - targets:
                    - alertmanager:9093

scrape_configs:
    - job_name: "slo-dojo-app"
      static_configs:
          - targets: ["app:3000"]

    - job_name: "load-balancer"
      static_configs:
          - targets: ["traefik:8080"]
