# Example only. This file is not loaded by docker-compose by default.
#
# To use an external receiver, copy the relevant receiver block into
# alertmanager/alertmanager.yml, replace the placeholders with real values,
# and restart Alertmanager.
#
# Alertmanager supports many receivers, including Discord, Pushover, Slack,
# PagerDuty, Opsgenie, email, and generic webhooks. See:
# https://prometheus.io/docs/alerting/latest/configuration/

global:
    resolve_timeout: 30s

route:
    receiver: "null"
    group_by:
        - alertname
    group_wait: 10s
    group_interval: 10s
    repeat_interval: 4h
    routes:
        - receiver: local-browser
          continue: true
        - receiver: discord
          continue: true
        - receiver: pushover
          continue: true
        - receiver: pagerduty
          continue: true

receivers:
    - name: "null"

    - name: local-browser
      webhook_configs:
          - url: http://app:3000/alertmanager
            send_resolved: true

    - name: discord
      discord_configs:
          - webhook_url: "https://discord.com/api/webhooks/REPLACE_ME"
            send_resolved: true
            title: '{{ .CommonLabels.alertname }}'
            message: '{{ .CommonAnnotations.summary }}'

    - name: pushover
      pushover_configs:
          - user_key: "REPLACE_ME"
            token: "REPLACE_ME"
            send_resolved: true
            title: '{{ .CommonLabels.alertname }}'
            message: '{{ .CommonAnnotations.summary }}'

    - name: pagerduty
      pagerduty_configs:
          - routing_key: "REPLACE_ME"
            send_resolved: true
            description: '{{ .CommonAnnotations.summary }}'
