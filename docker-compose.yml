services:
    db:
        container_name: postgres
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - DATABASE_NAME=api
            - USER=apiuser
            - USER_PASSWORD=apicontrol
        ports:
            - "127.0.0.1:5432:5432"
        networks:
            - slo-dojo
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U postgres -d api && psql -U postgres -d api -tAc \"SELECT CASE WHEN EXISTS (SELECT 1 FROM referrals) THEN 1 ELSE 0 END\" | grep -q 1",
                ]
            interval: 5s
            timeout: 5s
            retries: 30
        volumes:
            - postgres-data:/var/lib/postgresql
            - ./sql-scripts/create-database.sh:/docker-entrypoint-initdb.d/01-create-database.sh
            - ./sql-scripts/create-tables.sh:/docker-entrypoint-initdb.d/02-create-tables.sh
            - ./sql-scripts/seed-data.sql:/docker-entrypoint-initdb.d/03-seed-data.sql

    app:
        container_name: app
        build: .
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped
        ports:
            - "127.0.0.1:3000:3000"
        networks:
            - slo-dojo
        environment:
            - DB_HOST=postgres
            - DB_NAME=api
            - DB_USER=apiuser
            - DB_PASSWORD=apicontrol
            - DOJO_LOGIN_PASSWORD=slo-dojo-password
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "node -e \"fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
                ]
            interval: 5s
            timeout: 5s
            retries: 12
        deploy:
            resources:
                limits:
                    cpus: "0.50"
                    memory: 100M
                reservations:
                    cpus: "0.25"
                    memory: 50M

    workload:
        container_name: workload
        build: .
        command: ["node", "load-generator.js"]
        restart: unless-stopped
        depends_on:
            app:
                condition: service_healthy
        networks:
            - slo-dojo
        environment:
            - BASE_URL=http://app:3000
            - DOJO_LOGIN_PASSWORD=slo-dojo-password
            - HOMEPAGE_INTERVAL_MS=250
            - LOGIN_INTERVAL_MS=300
            - SEARCH_INTERVAL_MS=350

    traefik:
        image: "traefik:v3.7.1"
        container_name: "traefik"
        command:
            # - "--log.level=DEBUG"
            - "--api.insecure=true"
            # - "--providers.docker.exposedbydefault=false"
            # - "--entrypoints.web.address=:80"
            - "--metrics.prometheus=true"
            - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
        ports:
            - "127.0.0.1:8080:8080"
        networks:
            - slo-dojo
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: "0.75"
                    memory: 200M
                reservations:
                    cpus: "0.50"
                    memory: 100M

    alertmanager:
        container_name: alertmanager
        image: prom/alertmanager:v0.32.1
        depends_on:
            app:
                condition: service_healthy
        command:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
        ports:
            - "127.0.0.1:9093:9093"
        volumes:
            - ./alertmanager/:/etc/alertmanager/
        networks:
            - slo-dojo
        restart: unless-stopped

    prometheus:
        container_name: prometheus
        image: prom/prometheus:v3.5.3
        depends_on:
            - alertmanager
        volumes:
            - ./prometheus/:/etc/prometheus/
            # - prometheus_data:/prometheus
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.console.libraries=/usr/share/prometheus/console_libraries"
            - "--web.console.templates=/usr/share/prometheus/consoles"
        ports:
            - "127.0.0.1:9090:9090"
        networks:
            - slo-dojo
        restart: unless-stopped

    grafana:
        container_name: grafana
        image: grafana/grafana:13.0.1-security-01-ubuntu
        user: "472"
        depends_on:
            - prometheus
        networks:
            - slo-dojo
        # because our app backend is running on 3000
        ports:
            - "127.0.0.1:4000:3000"
        volumes:
            - grafana-data:/var/lib/grafana
            - ./grafana/provisioning:/etc/grafana/provisioning
        environment:
            - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/application.json
            - GF_AUTH_ANONYMOUS_ENABLED=true
            - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: "0.50"
                    memory: 256M
                reservations:
                    cpus: "0.25"
                    memory: 64M

volumes:
    postgres-data:
    grafana-data:

networks:
    slo-dojo:
        driver: bridge
